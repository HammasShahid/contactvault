sonar.projectKey=contactvault
sonar.projectName=ContactVault

# Sources
sonar.sources=backend/src/main/java,frontend/web/src
sonar.tests=backend/src/test/java

# Coverage
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/web/coverage/lcov.info
sonar.typescript.tsconfigPath=frontend/web/tsconfig.json

# Backend exclusions
sonar.exclusions=\
  backend/src/main/java/**/dto/**, \
  backend/src/main/java/**/entity/**, \
  backend/src/main/java/**/mapper/**, \
  backend/src/main/java/**/exception/Bad*.java, \
  backend/src/main/java/**/exception/Forbidden*.java, \
  backend/src/main/java/**/exception/NotFound*.java, \
  backend/src/main/java/**/exception/Unauthorized*.java, \
  frontend/web/src/components/ui/**, \
  frontend/web/src/routeTree.gen.ts

sonar.coverage.exclusions=\
  backend/src/main/java/**/dto/**, \
  backend/src/main/java/**/entity/**, \
  backend/src/main/java/**/mapper/**, \
  backend/src/main/java/**/config/**, \
  backend/src/main/java/**/exception/**, \
  frontend/web/src/components/ui/**, \
  frontend/web/src/routeTree.gen.ts, \
  frontend/web/src/main.tsx, \
  frontend/web/src/types/**, \
  frontend/web/src/lib/queryKeys.ts